services:
  backend:
    build:
      context: ./backend
    ports:
      - "8018:8000"
    env_file:
      - ./backend/.env

  frontend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3018"
    ports:
      - "3018:3018"
    environment:
      VITE_API_URL: http://localhost:8018
    depends_on:
      - backend

volumes:
  client_node_modules: